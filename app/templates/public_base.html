{% macro icon(name, extra='') -%}<svg class="icon {{ extra }}" aria-hidden="true" focusable="false"><use href="/static/icons/icons.svg?v=3.6.0#{{ name }}"></use></svg>{%- endmacro %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="{{ system.primary_color if system else '#0f766e' }}"><title>{% block title %}{{ system.product_name if system else 'EscutaPet' }}{% endblock %}</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="{{ '/branding/favicon.png?v=' ~ system.branding_version if system and system.logo_icon_file else '/static/img/pwa-192.png' }}"><link rel="apple-touch-icon" href="{{ '/branding/pwa-192.png?v=' ~ system.branding_version if system and system.logo_icon_file else '/static/img/pwa-192.png' }}"><link rel="stylesheet" href="/static/css/app.css?v=3.6.0"><link rel="stylesheet" href="/static/css/visual-v3.css?v=3.6.0"><style>:root{--brand:{{ system.primary_color if system else '#0f766e' }};--brand-2:{{ system.secondary_color if system else '#2563eb' }};}</style></head><body class="public-bg">{% for item in flashes %}<div class="flash public-flash {{ item.category }}">{{ item.message }}</div>{% endfor %}{% block content %}{% endblock %}<script src="/static/js/app.js?v=3.6.0"></script>{% block scripts %}{% endblock %}</body></html>
